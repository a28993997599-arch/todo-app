<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0d">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>寰呭姙</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div>
        <h1 class="app-title">寰呭姙</h1>
        <p class="app-date" id="date-label"></p>
      </div>
      <div class="app-count" id="count-label">0 椤?/div>
    </header>

    <div class="progress">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-text" id="progress-text"></span>
    </div>

    <nav class="filters" id="filters" aria-label="鍒嗙被绛涢€?></nav>

    <form class="add-form" id="add-form" autocomplete="off">
      <input type="text" class="add-input" id="add-input" placeholder="璁扮偣浠€涔堚€? aria-label="鏂颁换鍔?>
      <div class="add-options">
        <label class="field">
          <span class="field-label">浼樺厛绾?/span>
          <select id="add-priority" class="select">
            <option value="none">鏃?/option>
            <option value="high">楂?/option>
            <option value="medium">涓?/option>
            <option value="low">浣?/option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">鎴</span>
          <input type="date" id="add-date" class="select">
        </label>
        <label class="field">
          <span class="field-label">鍒嗙被</span>
          <select id="add-category" class="select"></select>
        </label>
        <button type="submit" class="add-btn">娣诲姞</button>
      </div>
    </form>

    <div class="sort-bar">
      <span class="sort-label">鎺掑簭</span>
      <div class="sort-group" id="sort-group">
        <button class="sort-btn active" data-sort="manual">鎵嬪姩</button>
        <button class="sort-btn" data-sort="priority">浼樺厛绾?/button>
        <button class="sort-btn" data-sort="due">鎴鏃ユ湡</button>
      </div>
    </div>

    <ul class="task-list" id="task-list"></ul>

    <button class="clear-btn" id="clear-done">娓呴櫎宸插畬鎴?/button>

    <div class="empty" id="empty">
      <span class="empty-mark">鉁?/span>
      <p>绌虹┖濡備篃锛屽厛璁颁竴浠跺皬浜嬪惂</p>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.log('Service Worker 娉ㄥ唽澶辫触锛?, err);
        });
      });
    }
  </script>
</body>
</html>
